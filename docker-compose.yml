services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_security_iot
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/db_data

volumes:
  db_data:
